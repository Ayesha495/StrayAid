name: Seed demo data

# Fills the live site with the fake demo data, from a GitHub runner so the seeding (which runs
# the AI detector on every photo) can't strain the small live server. Run it from the Actions
# tab. Safe to repeat. Demo stories last 24 hours, so choose "stories" before a presentation,
# and "remove" once real users arrive.

on:
  # A change to this file runs it once, seeding everything.
  push:
    branches: [main]
    paths:
      - .github/workflows/seed-demo.yml
  workflow_dispatch:
    inputs:
      what:
        description: Everything, only bring the demo stories back, or delete all demo data
        type: choice
        options: [everything, stories, remove]
        default: everything

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "0"
      DJANGO_SECRET_KEY: only-used-by-this-one-off-job-to-start-django-${{ github.run_id }}-0123456789
      ALLOWED_HOSTS: localhost
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DATABASE_SSLMODE: require
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch the animal detector
        run: DEBUG=1 python manage.py download_ai_model
      - name: Lay out the bundled photos as they are on the server
        run: mkdir -p media && cp -r demo_images/stitch media/demo
      - name: Check the secrets
        run: python deploy/check_seed_secrets.py
      - name: Seed
        env:
          WHAT: ${{ inputs.what || 'everything' }}
        run: |
          option=""
          if [ "$WHAT" != "everything" ]; then option="--$WHAT"; fi
          set +e
          python manage.py seed_demo_data --production $option 2>&1 | tee seed.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then tail -n 3 seed.log | sed 's/^/::error title=Seeding stopped::/'; fi
          exit "$code"
