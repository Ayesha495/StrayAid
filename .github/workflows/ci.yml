name: CI/CD

# Every push and pull request is tested. A push to main that passes every check is then
# deployed to production: database policy (Neon), backend (Render), website (Vercel) and an
# over-the-air update for the Android app (EAS Update).

on:
  push:
    branches: [main, Ayesha]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never stop a production deploy halfway; newer pushes on other branches replace older runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: strayaid_ci
          POSTGRES_USER: strayaid
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strayaid" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-the-deploy-check-1234567890
      DATABASE_URL: postgres://strayaid:ci-only-password@localhost:5432/strayaid_ci
      DATABASE_SSLMODE: disable
      ALLOWED_HOSTS: api.strayaid.example
      CORS_ALLOWED_ORIGINS: https://strayaid.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt
      - name: Production settings pass Django's deploy check
        run: python manage.py check --deploy --fail-level WARNING
      - name: Every model change has a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations apply to Postgres
        run: python manage.py migrate --noinput
      - name: Tests with coverage
        run: |
          coverage run --source=. --omit="venv/*,*/migrations/*,*/tests.py,*/test_*.py,manage.py" manage.py test --settings=config.test_settings --noinput
          coverage report --fail-under=85

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/Web/strayaid_web_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/Web/strayaid_web_frontend/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Tests (including accessibility and colour contrast)
        run: npx jest --ci
      - name: Type check and production build
        run: npm run build
        env:
          VITE_API_URL: https://api.strayaid.example

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/Mobile/strayaid_mobile_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/Mobile/strayaid_mobile_frontend/package-lock.json
      - run: npm ci
      # The web policies are compared word for word with the app's.
      - name: Install the website too, for the shared-policy test
        working-directory: frontend/Web/strayaid_web_frontend
        run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (including accessibility and colour contrast)
        run: npx jest --ci
      - name: Known vulnerabilities in shipped dependencies
        # Remaining advisories sit in Expo's build tooling and need an Expo SDK upgrade.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-database:
    name: Deploy database policy (Neon)
    needs: [backend, web, mobile, secrets]
    # Deploys start once the production environment's BACKEND_URL variable is set.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.BACKEND_URL != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      # Applies neon.ts to the production branch. Schema migrations run when the backend starts.
      - run: npx neon@latest deploy --project-id bitter-block-07976299 --branch production --no-env-pull --yes
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

  deploy-backend:
    name: Deploy backend (Render)
    needs: [deploy-database]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}/api/health/
    steps:
      - name: Trigger the Render deploy
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      - name: Wait until the backend answers its health check
        run: |
          sleep 60
          for attempt in $(seq 1 40); do
            if curl --fail --silent "${{ vars.BACKEND_URL }}/api/health/" > /dev/null; then
              echo "Backend is healthy."; exit 0
            fi
            sleep 15
          done
          echo "Backend did not become healthy in time; check the Render deploy log." >&2
          exit 1

  deploy-web:
    name: Deploy website (Vercel)
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.WEBSITE_URL }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      # The Vercel project's Root Directory points at the website folder.
      - run: vercel pull --yes --environment=production
      - run: vercel build --prod
      - run: vercel deploy --prebuilt --prod

  deploy-mobile:
    name: Publish app update (EAS Update)
    needs: [deploy-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend/Mobile/strayaid_mobile_frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the app change in this push?
        id: changes
        working-directory: .
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -q '^frontend/Mobile/'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No app changes; nothing to publish."
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.app == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/Mobile/strayaid_mobile_frontend/package-lock.json
      - run: npm ci
        if: steps.changes.outputs.app == 'true'
      # JavaScript-only changes reach installed APKs on their next launches. Native changes
      # (new native libraries, an Expo SDK upgrade) still need a new APK: eas build.
      - run: npx eas-cli@latest update --channel production --platform android --message "$(echo "$COMMIT_MESSAGE" | head -n 1)" --non-interactive
        if: steps.changes.outputs.app == 'true'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.BACKEND_URL }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 998658289609-u4an6pas5lcpg578tb3c1rhdre8g5eji.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 998658289609-1g2mm1bre24hlccle05gmon0c416h44v.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 998658289609-9afrhr6aesljjbf2o9kdbc10k6vlq1ac.apps.googleusercontent.com
