# Load balancer in front of the backend servers (docker compose). Docker's DNS gives every
# replica's address for "backend" when nginx starts; recreate this container after scaling.

limit_req_zone $binary_remote_addr zone=per_client:10m rate=30r/s;

log_format balanced '$remote_addr "$request" $status upstream=$upstream_addr time=$upstream_response_time';

upstream backend_servers {
    # The server with the fewest requests in hand gets the next one, which suits a mix of quick
    # reads and slow photo checks better than taking turns.
    least_conn;
    server backend:8000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_tokens off;
    access_log /var/log/nginx/access.log balanced;

    # A little over the app's 10 MB photo limit, so oversized uploads stop here.
    client_max_body_size 12m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    location / {
        limit_req zone=per_client burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwritten, never appended to: whatever the client sent in this header is dropped,
        # so the app's NUM_PROXIES=1 reads the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 125s;

        # If a server dies, its share moves to the others. POSTs aren't retried: a report or
        # an approval must never run twice.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
