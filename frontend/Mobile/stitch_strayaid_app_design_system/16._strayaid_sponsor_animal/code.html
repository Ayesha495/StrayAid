<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>StrayAid - Sponsor Animal</title>
<!-- Tailwind CSS CDN with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Inter & Manrope styling -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration for StrayAid Design System -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rescue: {
              DEFAULT: '#1e6b56',
              dark: '#165242',
              light: '#e8f3ef',
              soft: '#d2e7e0',
              emerald: '#35A982',
              mint: '#E7F4EE'
            },
            neutral: {
              title: '#111827',
              body: '#4b5563',
              subtle: '#6b7280',
              border: '#e5e7eb',
              surface: '#F8FAF9'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Manrope', 'sans-serif']
          },
          boxShadow: {
            'card': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'nav-btn': '0 2px 8px rgba(0, 0, 0, 0.15)',
            'float': '0 -4px 16px rgba(0, 0, 0, 0.04)'
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Specific Mobile Emulation -->
<style data-purpose="viewport-and-touch">
    body {
      background-color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:py-6">
<!-- BEGIN: PhoneFrameWrapper -->
<!-- Container replicating the iPhone dimensions and aesthetic (390px x 844px) -->
<div class="relative w-full max-w-[390px] h-[844px] bg-[#ffffff] sm:rounded-[44px] overflow-hidden shadow-2xl flex flex-col border border-slate-200/80">
<!-- BEGIN: iOSStatusBar -->
<!-- Top status bar with time, cellular, wifi and battery indications -->
<div class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between px-7 pt-3.5 pb-2 text-white pointer-events-none select-none">
<!-- Time -->
<span class="text-[14px] font-semibold tracking-tight font-sans drop-shadow-sm">9:41</span>
<!-- Icons Set: Cellular, Wifi, Battery -->
<div class="flex items-center space-x-1.5 drop-shadow-sm">
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<path d="M1 9.5h2v2H1v-2zm4-3h2v5H5v-5zm4-3h2v8H9v-8zm4-3h2v11h-2V.5z"></path>
</svg>
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.5C5.2 2.5 2.7 3.6.8 5.4l1.4 1.4C3.8 5.3 5.8 4.4 8 4.4s4.2.9 5.8 2.4l1.4-1.4C13.3 3.6 10.8 2.5 8 2.5zm0 3.8C6.3 6.3 4.7 7 3.6 8.2L5 9.6c.8-.8 1.8-1.3 3-1.3s2.2.5 3 1.3l1.4-1.4C11.3 7 9.7 6.3 8 6.3zm0 3.8c-.8 0-1.5.3-2 .8L8 13l2-2.1c-.5-.5-1.2-.8-2-.8z"></path>
</svg>
<!-- iOS Style Battery Icon -->
<div class="w-5 h-2.5 border border-white rounded-[3.5px] p-[1px] flex items-center">
<div class="h-full w-3.5 bg-white rounded-[1.5px]"></div>
</div>
</div>
</div>
<!-- END: iOSStatusBar -->
<!-- BEGIN: FloatingTopNavigation -->
<!-- Navigation action buttons hovering over the dog photo -->
<nav aria-label="Screen Navigation" class="absolute top-11 left-0 right-0 z-20 px-5 flex items-center justify-between pointer-events-auto">
<!-- Back Button -->
<button aria-label="Go back" class="w-10 h-10 rounded-full bg-black/25 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-transform shadow-nav-btn" type="button">
<svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Right Action Buttons: Share & Favorite -->
<div class="flex items-center space-x-2.5">
<button aria-label="Share profile" class="w-10 h-10 rounded-full bg-black/25 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-transform shadow-nav-btn" type="button">
<svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<button aria-label="Bookmark" class="w-10 h-10 rounded-full bg-black/25 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-transform shadow-nav-btn" type="button">
<svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</nav>
<!-- END: FloatingTopNavigation -->
<!-- BEGIN: ScrollableContent -->
<main class="flex-1 overflow-y-auto custom-scrollbar flex flex-col pb-24" data-purpose="screen-content">
<!-- Hero Animal Image max showcase -->
<section class="relative w-full h-[290px] flex-shrink-0" data-purpose="hero-image-container">
<img alt="Close-up portrait of an adorable scruffy mixed-breed dog named Max with expressive warm brown eyes and a happy friendly expression, resting in warm gentle lighting outdoors, high quality animal rescue photography" class="w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQLXX9u0gkdbCbDwLBDScz0GmzMldke6ELtTKJwGTb1KOObDm0Fmqj7xHPMBX2_CAwpDOJNV2GsS56eWeCiKLmWHxsxCMPhI_Vx21dnWnIxCS03Gnre82kojyGv4Z-BGDuFefIaQ5b802hWHsmPfq7K0w4qfhH2NZTLaGG10lcMFQmVZtJrBX-GoBiYuQyvi4O55X-r1V_9eryGDUHJK84z9z1QbHQ9lhN9l97G5tP7td4wZNcIKFO6Q"/>
<!-- Top subtle dark gradient overlay for optimal icon visibility -->
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-transparent h-24 pointer-events-none"></div>
</section>
<!-- Animal Information Header Section -->
<section class="px-5 pt-4 pb-2 bg-white" data-purpose="animal-header-info">
<!-- Name & Badges -->
<div class="flex items-center justify-between">
<div class="flex items-center space-x-2">
<h1 class="text-2xl font-bold font-display text-neutral-title tracking-tight">Max</h1>
<!-- Paw / Heart Verified Rescue Icon -->
<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-rescue-mint text-rescue" title="Verified Rescue Animal">
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 20 20">
<path d="M10 2a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM6.5 4a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm7 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM4 8a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm12 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm-6 2c-2.5 0-5 1.8-5 4.5 0 1.9 1.5 3.5 3.4 3.5.9 0 1.6-.4 2.1-.9.5.5 1.2.9 2.1.9 1.9 0 3.4-1.6 3.4-3.5 0-2.7-2.5-4.5-5-4.5z"></path>
</svg>
</span>
</div>
<!-- Share icon shortcut or status indicator -->
<button aria-label="Quick share" class="text-slate-400 hover:text-slate-600 transition-colors p-1" type="button">
<svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Species & Status Tags -->
<p class="text-xs font-semibold text-neutral-subtle mt-0.5 tracking-wide">
          Dog <span class="mx-1">•</span> <span class="text-rescue font-medium">Rescued</span>
</p>
<!-- Shelter Attribution & Location -->
<div class="mt-2.5 space-y-1">
<!-- Shelter Name -->
<div class="flex items-center text-xs font-medium text-slate-700">
<svg class="w-3.5 h-3.5 text-rescue mr-1.5 flex-shrink-0" fill="currentColor" viewbox="0 0 20 20">
<path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
</svg>
<span>Paws &amp; Care Rescue</span>
</div>
<!-- City & Region Location -->
<div class="flex items-center text-xs font-medium text-slate-500">
<svg class="w-3.5 h-3.5 text-slate-400 mr-1.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Islamabad, Pakistan</span>
</div>
</div>
<!-- Sponsor Count Metadata Row -->
<div class="mt-3.5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600">
<div class="flex items-center space-x-1.5">
<!-- Mini avatars stacking for existing sponsors -->
<div class="flex -space-x-1.5 overflow-hidden">
<span class="inline-flex items-center justify-center w-5 h-5 rounded-full ring-2 ring-white bg-slate-200 text-[9px] font-bold text-slate-600">AK</span>
<span class="inline-flex items-center justify-center w-5 h-5 rounded-full ring-2 ring-white bg-emerald-100 text-[9px] font-bold text-rescue">MR</span>
<span class="inline-flex items-center justify-center w-5 h-5 rounded-full ring-2 ring-white bg-amber-100 text-[9px] font-bold text-amber-700">SA</span>
</div>
<span class="text-slate-500 font-medium ml-1">Sponsor count:</span>
<span class="font-bold text-neutral-title">18</span>
</div>
<span class="text-[11px] text-rescue font-semibold bg-rescue-light px-2 py-0.5 rounded-full">Ongoing Need</span>
</div>
</section>
<!-- Divider line -->
<div class="h-1.5 bg-slate-50 w-full border-t border-b border-slate-100/70 my-1"></div>
<!-- BEGIN: SponsorshipSelectionSection -->
<section class="px-5 pt-3 pb-2" data-purpose="sponsorship-selector">
<h2 class="text-sm font-bold text-neutral-title font-display tracking-tight">Choose amount</h2>
<!-- Tier Selection Buttons Grid -->
<div class="grid grid-cols-4 gap-2 mt-3" data-purpose="amount-options">
<!-- Option 1: PKR 500 (Unselected) -->
<button class="py-2.5 px-1 rounded-xl border border-slate-200 bg-white text-center hover:border-slate-300 transition-colors focus:outline-none" type="button">
<span class="block text-[11px] font-medium text-slate-400 uppercase tracking-wider">PKR</span>
<span class="block text-xs font-bold text-slate-800 mt-0.5">500</span>
</button>
<!-- Option 2: PKR 1,000 (Active / Selected State as shown in Screen 16) -->
<button class="py-2.5 px-1 rounded-xl bg-rescue text-white text-center shadow-sm ring-2 ring-rescue ring-offset-1 focus:outline-none" type="button">
<span class="block text-[11px] font-semibold text-emerald-100 uppercase tracking-wider">PKR</span>
<span class="block text-xs font-bold text-white mt-0.5">1,000</span>
</button>
<!-- Option 3: PKR 2,000 (Unselected) -->
<button class="py-2.5 px-1 rounded-xl border border-slate-200 bg-white text-center hover:border-slate-300 transition-colors focus:outline-none" type="button">
<span class="block text-[11px] font-medium text-slate-400 uppercase tracking-wider">PKR</span>
<span class="block text-xs font-bold text-slate-800 mt-0.5">2,000</span>
</button>
<!-- Option 4: Custom (Unselected) -->
<button class="py-2.5 px-1 rounded-xl border border-slate-200 bg-white text-center hover:border-slate-300 transition-colors focus:outline-none" type="button">
<span class="block text-[11px] font-medium text-slate-400">Flex</span>
<span class="block text-xs font-bold text-slate-700 mt-0.5">Custom</span>
</button>
</div>
<!-- Impact Clarification Notice -->
<div class="mt-3.5 flex items-center space-x-2 text-xs text-slate-600 bg-slate-50/80 p-2.5 rounded-lg border border-slate-100">
<svg class="w-4 h-4 text-rescue flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="font-normal leading-tight text-slate-600">Supports food, medical care and shelter</span>
</div>
</section>
<!-- END: SponsorshipSelectionSection -->
<!-- BEGIN: PledgedTrackerSection -->
<section class="px-5 pt-3 pb-3" data-purpose="pledged-support-tracker">
<!-- Progress Bar Title & Current Ratio -->
<div class="flex items-center justify-between text-xs mb-2">
<span class="font-bold text-neutral-title font-display">Pledged support</span>
<span class="font-bold text-slate-700 font-mono text-[12px]">18 / 50</span>
</div>
<!-- Progress Bar (36% filled, corresponding to 18 of 50 target) -->
<div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden p-0.5 border border-slate-200/50">
<div class="h-full bg-rescue rounded-full transition-all duration-500 ease-out" style="width: 36%;"></div>
</div>
<!-- Micro Impact Subtitle -->
<div class="flex items-center justify-between text-[11px] text-slate-500 mt-2">
<span class="flex items-center text-rescue font-medium">
<svg class="w-3 h-3 mr-1 fill-current" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" fill-rule="evenodd"></path>
</svg>
            Monthly pledge
          </span>
<span class="text-slate-400">32 sponsors needed to reach goal</span>
</div>
</section>
<!-- END: PledgedTrackerSection -->
<!-- BEGIN: OrganizationMiniBadge -->
<!-- Shelter Trust Info Snippet matching design guidelines -->
<section class="px-5 pt-1 pb-4">
<div class="rounded-xl border border-slate-100 bg-[#fbfdfc] p-3 flex items-center justify-between">
<div class="flex items-center space-x-2.5">
<div class="w-8 h-8 rounded-full bg-rescue/10 text-rescue flex items-center justify-center font-bold text-xs">
              🐾
            </div>
<div>
<p class="text-xs font-semibold text-neutral-title">Verified NGO Partner</p>
<p class="text-[11px] text-slate-500">100% of funds go toward animal care</p>
</div>
</div>
<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</section>
<!-- END: OrganizationMiniBadge -->
</main>
<!-- END: ScrollableContent -->
<!-- BEGIN: FixedBottomPledgeAction -->
<!-- Floating Bottom Bar with Primary CTA button and iOS Home Indicator -->
<footer class="absolute bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-5 pt-3 pb-6 flex flex-col shadow-float" data-purpose="bottom-cta-bar">
<!-- Primary Action CTA Button -->
<button class="w-full h-12 rounded-xl bg-rescue hover:bg-rescue-dark active:scale-[0.99] transition-all text-white font-semibold text-sm flex items-center justify-center shadow-md shadow-rescue/20 tracking-wide font-display" type="button">
<!-- Heart / Hand Icon -->
<svg class="w-4 h-4 mr-2 fill-current" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" fill-rule="evenodd"></path>
</svg>
<span>Pledge Support</span>
</button>
<!-- iOS Home Indicator Indicator Pill -->
<div class="w-32 h-1 bg-slate-900/20 rounded-full mx-auto mt-3.5 mb-[-8px]"></div>
</footer>
<!-- END: FixedBottomPledgeAction -->
</div>
<!-- END: PhoneFrameWrapper -->
</body></html>
