<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StrayAid - Sign In</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              rescue: '#1E6B56',
              emerald: '#35A982',
              mint: '#E7F4EE',
              coral: '#F47C6C',
              amber: '#F4BB60',
              blue: '#4A90E2',
              navy: '#243447',
              gray: '#747C74',
              inputBg: '#F9FAFB',
              border: '#E5E7EB',
            }
          },
          fontFamily: {
            manrope: ['Manrope', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Layout Styles -->
<style data-purpose="layout">
    body {
      background-color: #F1F4F8;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 844px;
      height: 844px;
    }
  </style>
<!-- END: Custom Layout Styles -->
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- BEGIN: Mobile Device Container (Screen 5: Sign In) -->
<main class="mobile-frame bg-white relative flex flex-col justify-between shadow-2xl overflow-hidden sm:rounded-[44px] border border-gray-100" data-purpose="mobile-viewport">
<!-- BEGIN: iOS Status Bar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-20 shrink-0 select-none" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight text-[#243447] font-manrope">9:41</span>
<!-- Dynamic Island Mockup / Camera Sensor Gap -->
<div aria-hidden="true" class="w-24 h-4 bg-transparent rounded-full mx-auto"></div>
<!-- iOS Status Icons -->
<div class="flex items-center space-x-1.5 text-[#243447]">
<!-- Signal Strength Indicator -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="3" rx="0.5" width="3" x="0" y="9"></rect>
<rect height="6" rx="0.5" width="3" x="4.5" y="6"></rect>
<rect height="9" rx="0.5" width="3" x="9" y="3"></rect>
<rect height="12" rx="0.5" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.5C10.4 2.5 12.6 3.4 14.2 5L15.6 3.5C13.6 1.6 11 0.5 8 0.5C5 0.5 2.4 1.6 0.4 3.5L1.8 5C3.4 3.4 5.6 2.5 8 2.5ZM8 6.5C9.5 6.5 10.9 7.1 11.9 8.1L13.3 6.6C11.9 5.3 10 4.5 8 4.5C6 4.5 4.1 5.3 2.7 6.6L4.1 8.1C5.1 7.1 6.5 6.5 8 6.5ZM8 10.5C8.8 10.5 9.5 11.2 9.5 12C9.5 12.8 8.8 13.5 8 13.5C7.2 13.5 6.5 12.8 6.5 12C6.5 11.2 7.2 10.5 8 10.5Z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border-[1.5px] border-[#243447] rounded-[3px] p-[0.5px] flex items-center relative">
<div class="h-full w-3.5 bg-[#243447] rounded-[1px]"></div>
<div class="w-[2px] h-1 bg-[#243447] absolute -right-[3px] rounded-r-sm top-[2px]"></div>
</div>
</div>
</header>
<!-- END: iOS Status Bar -->
<!-- BEGIN: Top Navigation Bar -->
<nav class="px-5 pt-2 pb-1 flex items-center" data-purpose="top-navigation">
<button aria-label="Go back" class="p-2 -ml-2 text-brand-navy hover:text-brand-rescue transition-colors focus:outline-none rounded-full active:bg-gray-100" type="button">
<svg class="w-6 h-6 stroke-[2.2] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
<!-- END: Top Navigation Bar -->
<!-- BEGIN: Main Screen Content -->
<div class="px-6 flex-1 flex flex-col justify-start pt-1 pb-4" data-purpose="form-content">
<!-- Brand Logo Section -->
<div class="flex items-center space-x-2.5 mb-6" data-purpose="brand-logo">
<div class="w-9 h-9 rounded-xl bg-brand-rescue flex items-center justify-center text-white shadow-sm shadow-emerald-900/10">
<!-- Paw-in-Heart SVG Logo -->
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill-opacity="0.2"></path>
<path d="M12 17c-1.8 0-3.3-1.1-3.9-2.7-.2-.5.1-1.1.7-1.3.5-.2 1.1.1 1.3.7.3.9 1.1 1.4 1.9 1.4.8 0 1.6-.5 1.9-1.4.2-.5.8-.8 1.3-.7.5.2.8.8.7 1.3-.6 1.6-2.1 2.7-3.9 2.7zm-2.7-5.5c-.8 0-1.4-.7-1.4-1.5s.6-1.5 1.4-1.5 1.4.7 1.4 1.5-.6 1.5-1.4 1.5zm5.4 0c-.8 0-1.4-.7-1.4-1.5s.6-1.5 1.4-1.5 1.4.7 1.4 1.5-.6 1.5-1.4 1.5zm-5.7-3.6c-.7 0-1.3-.6-1.3-1.3 0-.7.6-1.3 1.3-1.3.7 0 1.3.6 1.3 1.3 0 .7-.6 1.3-1.3 1.3zm6 0c-.7 0-1.3-.6-1.3-1.3 0-.7.6-1.3 1.3-1.3.7 0 1.3.6 1.3 1.3 0 .7-.6 1.3-1.3 1.3z" fill="#ffffff"></path>
</svg>
</div>
<span class="text-[23px] font-extrabold tracking-tight text-brand-navy font-manrope">StrayAid</span>
</div>
<!-- Header Titles -->
<div class="mb-7" data-purpose="header-titles">
<h1 class="text-[27px] font-extrabold text-brand-navy font-manrope tracking-tight leading-snug">Welcome back</h1>
<p class="text-[14px] text-brand-gray font-normal mt-0.5">Sign in to continue</p>
</div>
<!-- Form Inputs Container -->
<form class="space-y-4" data-purpose="sign-in-form" onsubmit="event.preventDefault();">
<!-- Email Input Group -->
<div class="space-y-1.5">
<label class="block text-[13px] font-semibold text-brand-navy tracking-tight" for="email">Email address</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-xl border border-gray-200 bg-brand-inputBg text-brand-navy text-[14px] placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-rescue/20 focus:border-brand-rescue transition-all duration-200" id="email" name="email" placeholder="you@example.com" type="email" value="you@example.com"/>
</div>
</div>
<!-- Password Input Group -->
<div class="space-y-1.5">
<label class="block text-[13px] font-semibold text-brand-navy tracking-tight" for="password">Password</label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-4 pr-16 rounded-xl border border-gray-200 bg-brand-inputBg text-brand-navy text-[15px] tracking-widest placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-rescue/20 focus:border-brand-rescue transition-all duration-200" id="password" name="password" placeholder="••••••••" type="password" value="secretpassword"/>
<!-- Show/Hide Password Toggle -->
<button class="absolute right-4 text-[13px] font-semibold text-brand-gray hover:text-brand-navy transition-colors focus:outline-none select-none tracking-normal" data-purpose="password-visibility-toggle" id="toggle-password" type="button">
              Show
            </button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-0.5">
<a class="text-[13px] font-medium text-brand-gray hover:text-brand-rescue transition-colors" href="#">
            Forgot password?
          </a>
</div>
<!-- Primary Action Button: Sign In -->
<div class="pt-3">
<button class="w-full h-[50px] bg-brand-rescue hover:bg-[#185847] active:scale-[0.99] text-white font-manrope font-bold text-[15px] rounded-xl shadow-md shadow-brand-rescue/20 transition-all duration-200 flex items-center justify-center tracking-wide" data-purpose="sign-in-btn" type="submit">
            Sign In
          </button>
</div>
<!-- Social Sign-in Button: Continue with Google -->
<div class="pt-2">
<button class="w-full h-[50px] bg-white border border-gray-200 hover:bg-gray-50 active:scale-[0.99] text-brand-navy font-manrope font-semibold text-[14px] rounded-xl transition-all duration-200 flex items-center justify-center space-x-3 shadow-sm" data-purpose="google-sign-in-btn" type="button">
<!-- Google Multicolored 'G' Logo -->
<svg class="w-4 h-4 shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.66-5.17 3.66-9.12z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.27v3.13C3.26 21.3 7.35 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.57H1.27C.46 8.2 0 10.05 0 12s.46 3.8 1.27 5.43l4.01-3.14z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.7 1.27 6.57l4.01 3.14c.95-2.83 3.6-4.96 6.72-4.96z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
</div>
</form>
</div>
<!-- END: Main Screen Content -->
<!-- BEGIN: Footer Section -->
<footer class="w-full pb-8 flex flex-col items-center justify-center shrink-0" data-purpose="screen-footer">
<!-- Create Account Navigation -->
<a class="text-[14px] font-semibold text-brand-rescue hover:underline tracking-tight py-2 transition-all" href="#">
        Create account
      </a>
<!-- iOS Home Indicator Bar -->
<div aria-hidden="true" class="w-32 h-1 bg-gray-900/20 rounded-full mt-3"></div>
</footer>
<!-- END: Footer Section -->
</main>
<!-- END: Mobile Device Container -->
<!-- BEGIN: Client Interactivity Script -->
<script data-purpose="password-toggle-behavior">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleBtn.textContent = isPassword ? 'Hide' : 'Show';
          // Adjust tracking when in text mode for clean typography
          if (isPassword) {
            passwordInput.classList.remove('tracking-widest');
          } else {
            passwordInput.classList.add('tracking-widest');
          }
        });
      }
    });
  </script>
<!-- END: Client Interactivity Script -->
</body></html>
