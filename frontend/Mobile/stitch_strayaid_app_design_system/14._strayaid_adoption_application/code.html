<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StrayAid - Adoption Application</title>
<!-- Tailwind CSS CDN with forms & container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Manrope -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#1E6B56',
              dark: '#165544',
              light: '#EAF3F0',
              accent: '#35A982'
            },
            neutral: {
              surface: '#F8FAF9',
              subtle: '#F1F5F3',
              border: '#E2E8F0',
              title: '#0F172A',
              body: '#475569',
              muted: '#94A3B8'
            }
          },
          fontFamily: {
            sans: ['Manrope', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>
<style data-purpose="custom-layout">
    body {
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background-color: #ECEFEF;
      -webkit-font-smoothing: antialiased;
    }
    /* Hide native scrollbar for slick app viewport */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-6 bg-slate-100">
<!-- BEGIN: PhoneFrame -->
<div class="w-full max-w-[390px] h-[844px] bg-[#FAFBFB] text-slate-800 rounded-[44px] shadow-2xl overflow-hidden flex flex-col relative border-[7px] border-slate-900 select-none">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 pb-2 flex justify-between items-center z-20 bg-[#FAFBFB] text-slate-900 shrink-0">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<!-- Right Status Icons -->
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23C3.5 16.5 3 14.32 3 12c0-4.97 4.03-9 9-9s9 4.03 9 9c0 2.32-.5 4.5-1.35 6.23l-.62-.62C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 4c-2.76 0-5 2.24-5 5 0 1.25.46 2.39 1.22 3.28l.71-.71C8.36 13.94 8 13.01 8 12c0-2.21 1.79-4 4-4s4 1.79 4 4c0 1.01-.36 1.94-.93 2.57l.71.71C16.54 14.39 17 13.25 17 12c0-2.76-2.24-5-5-5zm0 8a3 3 0 100-6 3 3 0 000 6z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3c3.84 0 7.34 1.5 10 4l-10 10.02L2 11c2.66-2.5 6.16-4 10-4z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-slate-900 rounded-sm p-0.5 flex items-center">
<div class="h-full w-4 bg-slate-900 rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: NavigationBar -->
<nav aria-label="Top Bar" class="px-5 pt-1 pb-3 flex items-center justify-between bg-[#FAFBFB] shrink-0">
<!-- Back Button -->
<button aria-label="Go back" class="w-10 h-10 -ml-1 rounded-full flex items-center justify-center text-slate-800 hover:bg-slate-200/50 active:scale-95 transition-all" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" viewbox="0 0 24 24">
<polyline points="15 18 9 12 15 6"></polyline>
</svg>
</button>
<!-- Center Title -->
<h1 class="text-base font-bold text-slate-900 tracking-tight">Adoption Application</h1>
<!-- Right Placeholder for balance -->
<div class="w-10 h-10"></div>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 overflow-y-auto no-scrollbar px-5 pb-6">
<!-- Stepper / Progress Bar (4 Steps matching Screen 14) -->
<section aria-label="Application Progress" class="py-2.5 flex items-center justify-center">
<div class="flex items-center space-x-2.5">
<!-- Step 1: Active -->
<div class="flex items-center justify-center w-7 h-7 rounded-full bg-brand text-white font-bold text-xs shadow-sm shadow-brand/30">
            1
          </div>
<div class="w-8 h-[2px] bg-slate-300"></div>
<!-- Step 2 -->
<div class="flex items-center justify-center w-7 h-7 rounded-full bg-slate-100 text-slate-400 font-semibold text-xs border border-slate-300">
            2
          </div>
<div class="w-8 h-[2px] bg-slate-200"></div>
<!-- Step 3 -->
<div class="flex items-center justify-center w-7 h-7 rounded-full bg-slate-100 text-slate-400 font-semibold text-xs border border-slate-300">
            3
          </div>
<div class="w-8 h-[2px] bg-slate-200"></div>
<!-- Step 4 -->
<div class="flex items-center justify-center w-7 h-7 rounded-full bg-slate-100 text-slate-400 font-semibold text-xs border border-slate-300">
            4
          </div>
</div>
</section>
<!-- Step Label / Section Title -->
<div class="mt-4 mb-4">
<h2 class="text-lg font-bold text-slate-900 tracking-tight">Applicant Information</h2>
<p class="text-xs text-slate-500 mt-0.5">Please provide accurate personal details for verification.</p>
</div>
<!-- BEGIN: ApplicationForm -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Input: Full Name -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-slate-700" for="fullName">Full name</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-xl border border-slate-200 bg-white text-sm font-medium text-slate-800 shadow-xs focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors" id="fullName" placeholder="Enter your full name" type="text" value="Ayesha Tabassum"/>
</div>
</div>
<!-- Input: Phone Number -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-slate-700" for="phone">Phone number</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-xl border border-slate-200 bg-white text-sm font-medium text-slate-800 shadow-xs focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors tracking-wide" id="phone" placeholder="+92 300 0000000" type="tel" value="+92 300 1234567"/>
</div>
</div>
<!-- Selection: Home Type -->
<div class="space-y-2 pt-1">
<label class="block text-xs font-semibold text-slate-700">Home Type</label>
<div class="grid grid-cols-3 gap-2.5">
<!-- Apartment (Selected) -->
<button class="h-11 rounded-xl border-2 border-brand bg-brand-light/40 text-brand font-semibold text-xs flex items-center justify-center space-x-1.5 transition-all" type="button">
<svg class="w-4 h-4 text-brand" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Apartment</span>
</button>
<!-- House -->
<button class="h-11 rounded-xl border border-slate-200 bg-white text-slate-600 font-medium text-xs flex items-center justify-center space-x-1.5 hover:bg-slate-50 transition-all" type="button">
<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>House</span>
</button>
<!-- Other -->
<button class="h-11 rounded-xl border border-slate-200 bg-white text-slate-600 font-medium text-xs flex items-center justify-center space-x-1.5 hover:bg-slate-50 transition-all" type="button">
<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M8 14v.01M12 14v.01M16 14v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Other</span>
</button>
</div>
</div>
<!-- Selection: Other Pets? -->
<div class="space-y-2 pt-1">
<label class="block text-xs font-semibold text-slate-700">Other pets?</label>
<div class="grid grid-cols-2 gap-3">
<!-- Option: Yes (Active) -->
<button class="h-11 rounded-xl bg-brand text-white font-bold text-xs flex items-center justify-center space-x-2 shadow-sm shadow-brand/20 transition-all" type="button">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Yes</span>
</button>
<!-- Option: No -->
<button class="h-11 rounded-xl border border-slate-200 bg-white text-slate-600 font-semibold text-xs flex items-center justify-center space-x-1 hover:bg-slate-50 transition-all" type="button">
<span>No</span>
</button>
</div>
</div>
<!-- Additional Context Card: Animal Selected (Luna) -->
<div class="pt-2">
<div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-3 flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-11 h-11 rounded-xl bg-amber-100 flex items-center justify-center text-amber-800 font-bold overflow-hidden border border-amber-200/60">
<svg class="w-6 h-6 text-amber-700" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 3c-1.2 0-2.4.3-3.4.9-.7-.5-1.5-.9-2.4-.9-2.3 0-4.2 1.9-4.2 4.2 0 .8.2 1.6.6 2.3C2.2 10.5 2 11.7 2 13c0 4.4 4.5 8 10 8s10-3.6 10-8c0-1.3-.2-2.5-.6-3.5.4-.7.6-1.5.6-2.3 0-2.3-1.9-4.2-4.2-4.2-.9 0-1.7.4-2.4.9-1-.6-2.2-.9-3.4-.9z"></path>
</svg>
</div>
<div>
<div class="flex items-center space-x-1.5">
<span class="text-xs font-bold text-slate-800">Applying for: Luna</span>
<span class="text-[10px] px-1.5 py-0.2 rounded bg-emerald-50 text-emerald-700 font-medium border border-emerald-200">Rescued</span>
</div>
<p class="text-[11px] text-slate-500 font-medium">Cat • Vaccinated • 2 years</p>
</div>
</div>
<span class="text-xs text-brand font-bold pr-1">Change</span>
</div>
</div>
</form>
<!-- END: ApplicationForm -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomActionBar -->
<footer class="p-5 pt-2 pb-6 bg-[#FAFBFB] shrink-0 border-t border-slate-100">
<!-- Next Button -->
<button class="w-full h-13 py-3.5 bg-brand hover:bg-brand-dark active:scale-[0.99] text-white font-bold text-sm rounded-2xl shadow-lg shadow-brand/25 transition-all flex items-center justify-center space-x-2" type="button">
<span>Next</span>
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</button>
<!-- iOS Home Bar Indicator -->
<div class="w-32 h-1 bg-slate-900 rounded-full mx-auto mt-4"></div>
</footer>
<!-- END: BottomActionBar -->
</div>
<!-- END: PhoneFrame -->
</body></html>
