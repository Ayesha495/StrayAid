<!DOCTYPE html>

    .font-display {
      font-family: 'Manrope', sans-serif;

</div>

</div>

<p class="text-[13.5px] text-slate-500 font-normal leading-relaxed mb-6 max-w-[290px] mx-auto">

        </p>

<div class="space-y-3 w-full">
<!-- Button 1: Continue with Google -->

<svg class="w-4 h-4 text-white/90" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>

<span>Continue with Email</span>
</button>

<button class="text-[13.5px] font-semibold text-brand hover:text-brand-dark transition-colors py-1 px-3" type="button">

<div aria-hidden="true" class="w-full flex justify-center pt-2 pb-1">
<div class="w-32 h-1 bg-slate-900/80 rounded-full"></div>
</div>

</section>
